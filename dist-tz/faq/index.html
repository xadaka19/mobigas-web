    <div id="root"><div class="min-h-screen bg-gray-50"><script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is MobiGas?","acceptedAnswer":{"@type":"Answer","text":"MobiGas is Kenya's gas-on-credit delivery platform. Order gas now, get it delivered in 10–40 minutes, and repay within 30 days via M-Pesa."}},{"@type":"Question","name":"How do I sign up?","acceptedAnswer":{"@type":"Answer","text":"Download the MobiGas app, register with your National ID and phone number, add two guarantors, and apply for your credit limit. The whole process takes about 2 minutes."}},{"@type":"Question","name":"Is MobiGas available in my area?","acceptedAnswer":{"@type":"Answer","text":"We match you with verified vendors within 8km of your location. Coverage is expanding across Kenya — check the app to see vendors near you."}},{"@type":"Question","name":"How does the credit work?","acceptedAnswer":{"@type":"Answer","text":"You apply once through the app. Our partner bank runs an instant credit check (CRB) and sets your credit limit. You can then order gas anytime within that limit."}},{"@type":"Question","name":"Who provides the credit — MobiGas or a bank?","acceptedAnswer":{"@type":"Answer","text":"Credit is provided exclusively by our partner banks and SACCOs, not MobiGas. We're a platform that connects you to vendors and credit providers — we don't lend money ourselves."}},{"@type":"Question","name":"How do I repay?","acceptedAnswer":{"@type":"Answer","text":"Repay your partner bank directly via M-Pesa within 30 days. Bank interest applies per your agreement with them."}},{"@type":"Question","name":"What happens if I miss a repayment?","acceptedAnswer":{"@type":"Answer","text":"Late repayments may affect your credit limit and future ability to order on credit. Contact your partner bank directly if you anticipate difficulty repaying on time."}},{"@type":"Question","name":"How long does delivery take?","acceptedAnswer":{"@type":"Answer","text":"Typically 10–40 minutes depending on your location and vendor proximity."}},{"@type":"Question","name":"Are vendors verified?","acceptedAnswer":{"@type":"Answer","text":"Yes, every vendor is verified by our team before they can receive orders, including business registration and ID checks."}},{"@type":"Question","name":"What if I have an issue with my delivery?","acceptedAnswer":{"@type":"Answer","text":"Use the chat assistant on this site or email support@mobigas.co.ke with your order details and our team will follow up promptly."}},{"@type":"Question","name":"How do I become a MobiGas vendor?","acceptedAnswer":{"@type":"Answer","text":"Download the MobiGas Vendor app, register your business details, upload your business certificate or ID, add your gas products and pricing. Our team verifies you within 24 hours."}},{"@type":"Question","name":"How do vendors get paid?","acceptedAnswer":{"@type":"Answer","text":"Instantly to M-Pesa once the customer confirms delivery with their 4-digit PIN. The bank pays directly — no waiting."}},{"@type":"Question","name":"What is the Stock Boost Loan?","acceptedAnswer":{"@type":"Answer","text":"A loan vendors can apply for after 3 consistent months on the platform with 30+ deliveries, to help buy more gas stock in bulk. Provided by partner banks, not MobiGas."}},{"@type":"Question","name":"Is my data safe?","acceptedAnswer":{"@type":"Answer","text":"Yes. All data is encrypted in transit and at rest, and we follow Kenya's Data Protection Act (KDPA) requirements. See our Privacy Policy for details."}},{"@type":"Question","name":"Does MobiGas sell my data?","acceptedAnswer":{"@type":"Answer","text":"No. We never sell your personal data. It is only shared with partner banks for credit assessment and with vendors for delivery purposes."}}]}</script><div class="bg-[#0D1B40] py-6 px-6"><div class="max-w-3xl mx-auto flex items-center gap-4"><button class="text-gray-400 hover:text-white transition-color
